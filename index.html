<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock</title>
<style>
:root { --hue: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #fff; min-height: 100vh;
  background: radial-gradient(circle at 20% 10%, hsl(var(--hue),80%,35%), transparent 55%),
              radial-gradient(circle at 80% 90%, hsl(calc(var(--hue) + 120),80%,35%), transparent 55%),
              #0b0b10;
  background-attachment: fixed;
}
.topbar {
  position: sticky; top: 12px; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  margin: 12px auto 0; width: calc(100% - 28px); max-width: 1100px; padding: 14px 28px; border-radius: 22px;
  background: rgba(20,20,28,var(--bar-op, .55)); border: 1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 10px 40px rgba(0,0,0,.35); position: sticky;
}
.topbar .brand { font-weight: 800; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
.topbar nav a { color: rgba(255,255,255,.85); text-decoration: none; margin-left: 22px; font-size: 15px; }
.topbar nav a:hover { color: #fff; }
.topbar nav .navitem { display: inline-block; text-align: center; margin-left: 22px; vertical-align: top; }
.topbar nav .navitem a { margin-left: 0; display: block; }
.topbar nav .navphone { display: block; margin-top: 3px; font-size: 12px; letter-spacing: .5px; color: rgba(255,255,255,.7); text-decoration: none; white-space: nowrap; }
.topbar nav .navphone:hover { color: #fff; }

/* Стиль шапки: Instagram */
.topbar.insta { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); border: none; }
.topbar.insta .brand::before { content: ""; display: inline-block; width: 20px; height: 20px; margin-right: 10px; vertical-align: -4px;
  border: 2.5px solid #fff; border-radius: 6px; background: radial-gradient(circle at 50% 50%, transparent 3px, #fff 3px 5px, transparent 5px); }

/* Стиль шапки: Доска */
.topbar.board {
  border-radius: 6px; border: 3px solid #1a0d05; padding: 18px 44px;
  background: repeating-linear-gradient(92deg, #6b4423 0 14px, #5a381c 14px 17px, #7a5030 17px 30px, #4e2f17 30px 33px);
  box-shadow: inset 0 0 30px rgba(0,0,0,.7), 0 0 18px rgba(255,120,20,.55), 0 0 40px rgba(255,80,0,.3);
  animation: fire 1.6s ease-in-out infinite alternate; overflow: visible;
}
@keyframes fire {
  from { box-shadow: inset 0 0 30px rgba(0,0,0,.7), 0 0 14px rgba(255,120,20,.5), 0 -6px 30px rgba(255,80,0,.25); }
  to   { box-shadow: inset 0 0 38px rgba(0,0,0,.8), 0 0 26px rgba(255,160,30,.75), 0 -10px 46px rgba(255,90,0,.45); }
}
.topbar.board .brand, .topbar.board nav a { text-shadow: 0 2px 3px rgba(0,0,0,.8); }
.nail { position: absolute; width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ddd, #666 60%, #222); box-shadow: 0 1px 2px rgba(0,0,0,.8); display: none; }
.topbar.board .nail { display: block; }
.nail.a { top: 7px; left: 9px; } .nail.b { top: 7px; right: 9px; }
.nail.c { bottom: 7px; left: 9px; } .nail.d { bottom: 7px; right: 9px; }
.smoke { position: absolute; top: -6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(200,200,200,.35);
  filter: blur(8px); opacity: 0; display: none; animation: smoke 3.2s ease-out infinite; pointer-events: none; }
.topbar.board .smoke { display: block; }
.smoke.s1 { left: 12%; } .smoke.s2 { left: 48%; animation-delay: 1.1s; } .smoke.s3 { left: 82%; animation-delay: 2.1s; }
@keyframes smoke { 0% { transform: translateY(0) scale(.6); opacity: 0; } 25% { opacity: .5; } 100% { transform: translateY(-46px) scale(1.8); opacity: 0; } }
header { position: relative; text-align: center; padding: 70px 20px 30px; }
header.hasbanner { width: calc(100% - 28px); max-width: var(--ban-w, 760px); margin: 22px auto 0; padding: var(--ban-pad, 38px) 24px; min-height: var(--ban-h, 0px); display: flex; flex-direction: column; justify-content: center; border-radius: 30px; overflow: hidden; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,.28); box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); }
header.hasbanner .logo { font-size: clamp(48px, 10vw, 96px); }
header.hasbanner .tagline { font-size: 20px; margin-top: 8px; }
header.hasbanner .about { margin-top: 12px; font-size: 15px; color: rgba(255,255,255,.85); }
header.hasbanner::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,var(--ban-dim, .35)); }
header.hasbanner > * { position: relative; z-index: 1; }
.logo {
  position: relative; display: inline-block; text-transform: uppercase;
  font-size: clamp(64px, 14vw, 150px); font-weight: 900; letter-spacing: 6px;
  background:
    radial-gradient(circle at 12% 90%, rgba(255,255,255,.95) 0 3px, transparent 4px) 0 0 / 70px 90px,
    radial-gradient(circle at 55% 95%, rgba(255,255,255,.85) 0 4px, transparent 5px) 0 0 / 90px 110px,
    radial-gradient(circle at 80% 85%, rgba(255,255,255,.9) 0 2.5px, transparent 3.5px) 0 0 / 60px 80px,
    linear-gradient(90deg, hsl(var(--hue),100%,60%), hsl(calc(var(--hue) + 80),100%,62%), hsl(calc(var(--hue) + 160),100%,60%), hsl(calc(var(--hue) + 240),100%,62%));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 10px 25px rgba(0,0,0,.45)) saturate(1.5);
  animation: pulse 4s ease-in-out infinite, bubbles 3s linear infinite;
}
@keyframes bubbles {
  from { background-position: 0 0, 0 0, 0 0, 0 0; }
  to   { background-position: 0 -90px, 0 -110px, 0 -80px, 0 0; }
}
@keyframes pulse {
  0%,100% { transform: perspective(600px) rotateX(8deg) scale(1); }
  50% { transform: perspective(600px) rotateX(-4deg) scale(1.06); }
}
.tagline { margin-top: 14px; font-size: 24px; color: rgba(255,255,255,.85); }
.about { max-width: 720px; margin: 18px auto 0; font-size: 17px; line-height: 1.55; color: rgba(255,255,255,.7); }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
.card {
  background: rgba(255,255,255,.08); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,.15); border-radius: 26px; padding: 22px; transition: transform .3s;
}
.card:hover { transform: translateY(-6px); }
.card { position: relative; }
.badge { position: absolute; top: 14px; left: 14px; z-index: 2; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.badge.top { background: linear-gradient(90deg,#ffb300,#ff6d00); color: #fff; }
.badge.new { background: linear-gradient(90deg,#00c853,#00e5ff); color: #06240f; }
.badge.sale { background: linear-gradient(90deg,#ff1744,#d500f9); color: #fff; }
.stat { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 6px; }
.card img { width: 100%; height: 150px; object-fit: cover; border-radius: 18px; background: rgba(255,255,255,.1); }
.card h3 { margin: 14px 0 6px; font-size: 20px; }
.card p { font-size: 14px; color: rgba(255,255,255,.7); min-height: 40px; }
.price { margin: 10px 0; font-weight: 600; }
.btn {
  display: block; text-align: center; padding: 12px; border-radius: 14px; border: none;
  font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; text-decoration: none;
  background: hsl(var(--hue),80%,50%); transition: filter .2s;
}
.btn:hover { filter: brightness(1.15); }
.btn.dl { background: #30d158; }
.btn.gray { background: #555; }
.cartbar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(30,30,40,.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.2); border-radius: 22px; padding: 12px 18px;
  display: none; gap: 14px; align-items: center; z-index: 10;
}
.cartbar.show { display: flex; }
.contacts { text-align: center; padding: 60px 20px 30px; }
.site-footer { text-align: center; padding: 24px 20px 110px; font-size: 12px; line-height: 1.7; color: rgba(255,255,255,.45); border-top: 1px solid rgba(255,255,255,.08); max-width: 1100px; margin: 0 auto; }
.contacts h2 { font-size: 32px; margin-bottom: 20px; }
.contacts a {
  display: inline-block; margin: 6px; padding: 12px 22px; border-radius: 999px;
  background: rgba(255,255,255,.12); color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.2);
}
.contacts a:hover { background: rgba(255,255,255,.25); }
.gear {
  position: fixed; bottom: 18px; right: 18px; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: #fff;
  font-size: 20px; cursor: pointer; z-index: 30;
}
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
  align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 14px; z-index: 40;
}
.overlay.show { display: flex; }
.panel {
  width: 100%; max-width: 760px; background: #1c1c24; border: 1px solid rgba(255,255,255,.15);
  border-radius: 24px; padding: 26px;
}
.panel h2 { margin-bottom: 14px; }
.panel h3 { margin: 22px 0 10px; font-size: 18px; color: rgba(255,255,255,.85); }
.panel label { display: block; margin: 10px 0 4px; font-size: 13px; color: rgba(255,255,255,.6); }
.panel input, .panel textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.07); color: #fff; font-size: 15px; font-family: inherit;
}
.panel textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }
.appbox { border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 14px; margin: 12px 0; }
.appbox .switch { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
.appbox .switch input { width: auto; }
.panel .btn { display: inline-block; padding: 10px 18px; margin: 6px 6px 0 0; font-size: 15px; }
.hint { font-size: 13px; color: rgba(255,255,255,.55); margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <span class="nail a"></span><span class="nail b"></span><span class="nail c"></span><span class="nail d"></span>
  <span class="smoke s1"></span><span class="smoke s2"></span><span class="smoke s3"></span>
  <div class="brand" id="brand"></div>
  <nav>
    <a href="#catalog">Каталог</a>
    <div class="navitem">
      <a href="#contacts">Контакты</a>
      <a href="#contacts" class="navphone" id="navphone"></a>
    </div>
  </nav>
</div>

<header id="hero">
  <div class="logo" id="logo"></div>
  <div class="tagline" id="tagline"></div>
  <div class="about" id="about"></div>
</header>

<main id="catalog">
  <div class="grid" id="grid"></div>
</main>

<div class="cartbar" id="cartbar">
  <span id="cartcount"></span>
  <a class="btn" id="checkout" target="_blank" rel="noopener" style="padding:10px 18px">Заказать</a>
  <button class="btn gray" id="clear" style="padding:10px 18px">Очистить</button>
</div>

<section class="contacts" id="contacts">
  <h2>Контакты</h2>
  <div id="contactlinks"></div>
</section>

<footer class="site-footer">
  <div>© 2026 Собственность корпорации «Док Продакшн». Все права защищены.</div>
  <div>Создано и разработано Шевчук Сергеем Владимировичем.</div>
</footer>

<button class="gear" id="gear" title="Админ-панель">⚙</button>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* Данные по умолчанию. Менять их удобнее в админ-панели (кнопка ⚙ внизу справа). */
const DEFAULTS = {
  siteName: "Dock",
  tagline: "Приложения для Android",
  headerStyle: "apple",
  barOpacity: 55,
  banner: "",
  bannerDim: 35,
  bannerW: 760,
  bannerH: 0,
  about: "Авторские приложения, собранные с заботой о деталях. Выбери нужное, добавь в корзину и напиши мне в Telegram: я отвечу, договоримся об оплате и пришлю файл.",
  telegram: "",
  phone: "",
  whatsapp: "",
  vk: "",
  instagram: "",
  password: "admin123",
  apps: [
    { id: 1, name: "Первое приложение", desc: "Короткое описание: что умеет приложение.", image: "", price: "500 ₽", open: false, file: "", badge: "", downloads: 0, orders: 0 }
  ]
};

const SB_URL = "https://bfmtfzsvvpgjqfanhdkm.supabase.co";
const SB_KEY = "sb_publishable_2W8IALaexeYhxWhz-qPyBA_gDxCk-kg";
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
let S = JSON.parse(JSON.stringify(DEFAULTS));
delete S.password;
S.apps = [];
let deletedIds = [];
function save() {}
const fromRow = r => ({ id: r.id, name: r.name, desc: r.description || "", image: r.image_url || "", price: r.price || "", open: !!r.is_open, file: r.file_url || "", badge: r.badge || "" });
const toRow = a => ({ name: a.name, description: a.desc, image_url: a.image, price: a.price, is_open: !!a.open, file_url: a.file, badge: a.badge });

async function load() {
  try {
    const r = await fetch(SB_URL + '/storage/v1/object/public/apk/settings.json?t=' + Date.now());
    if (r.ok) Object.assign(S, await r.json());
  } catch (e) {}
  try {
    const { data } = await sb.from('apps').select('*').order('id');
    if (data) S.apps = data.map(fromRow);
  } catch (e) {}
  render();
}

async function uploadBlob(path, blob) {
  const { error } = await sb.storage.from('apk').upload(path, blob, { contentType: blob.type || 'application/octet-stream' });
  if (error) throw error;
  return sb.storage.from('apk').getPublicUrl(path).data.publicUrl;
}

async function uploadImg(file, max, q) {
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(im.width, im.height));
  const c = document.createElement('canvas');
  c.width = Math.round(im.width * k);
  c.height = Math.round(im.height * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  return uploadBlob('img/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.jpg', blob);
}

async function saveAll() {
  const { apps, ...rest } = S;
  const { error: e1 } = await sb.storage.from('apk').upload('settings.json', new Blob([JSON.stringify(rest)], { type: 'application/json' }), { upsert: true, cacheControl: '0', contentType: 'application/json' });
  if (e1) throw e1;
  for (const id of deletedIds) { const { error } = await sb.from('apps').delete().eq('id', id); if (error) throw error; }
  deletedIds = [];
  for (const a of S.apps) {
    if (a.id > 0) { const { error } = await sb.from('apps').update(toRow(a)).eq('id', a.id); if (error) throw error; }
    else { const { data, error } = await sb.from('apps').insert(toRow(a)).select().single(); if (error) throw error; a.id = data.id; }
  }
}
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let hue = 0;
setInterval(() => { hue = (hue + 1) % 360; document.documentElement.style.setProperty('--hue', hue); }, 100);

const cart = new Set();

function render() {
  document.title = S.siteName;
  document.getElementById('brand').textContent = S.siteName;
  const np = document.getElementById('navphone');
  np.textContent = S.phone || '';
  np.style.display = S.phone ? 'block' : 'none';
  document.documentElement.style.setProperty('--bar-op', (S.barOpacity == null ? 55 : S.barOpacity) / 100);
  document.getElementById('topbar').className = 'topbar' + (S.headerStyle === 'insta' ? ' insta' : S.headerStyle === 'board' ? ' board' : '');
  document.getElementById('logo').textContent = S.siteName;
  const hero = document.getElementById('hero');
  if (S.banner) { hero.classList.add('hasbanner'); hero.style.backgroundImage = `url("${S.banner}")`; }
  else { hero.classList.remove('hasbanner'); hero.style.backgroundImage = ''; }
  document.documentElement.style.setProperty('--ban-dim', (S.bannerDim == null ? 35 : S.bannerDim) / 100);
  document.documentElement.style.setProperty('--ban-w', (S.bannerW || 760) + 'px');
  document.documentElement.style.setProperty('--ban-h', (S.bannerH || 0) + 'px');
  document.getElementById('tagline').textContent = S.tagline;
  document.getElementById('about').textContent = S.about;

  const grid = document.getElementById('grid');
  grid.innerHTML = "";
  S.apps.forEach(app => {
    const card = document.createElement('div');
    card.className = 'card';
    const img = app.image ? `<img src="${esc(app.image)}" alt="">` : `<img alt="">`;
    const action = app.open && app.file
      ? `<a class="btn dl" data-dl="${app.id}" href="${esc(app.file)}" target="_blank" rel="noopener">Скачать</a>`
      : `<button class="btn" data-id="${app.id}">${cart.has(app.id) ? 'Добавлено ✓' : 'В корзину'}</button>`;
    const bt = {top: 'Топ', new: 'Новинка', sale: 'Акция'}[app.badge];
    const badgeHtml = bt ? `<div class="badge ${esc(app.badge)}">${bt}</div>` : '';
    card.innerHTML = `${badgeHtml}${img}<h3>${esc(app.name)}</h3><p>${esc(app.desc)}</p><div class="price">${esc(app.price)}</div>${action}`;
    grid.appendChild(card);
  });

  const links = [];
  if (S.phone) links.push(`<a href="#" id="phonebtn">Телефон: ${esc(S.phone)}</a>`);
  if (S.whatsapp) links.push(`<a href="https://wa.me/${esc(S.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`);
  if (S.telegram) links.push(`<a href="https://t.me/${esc(S.telegram)}" target="_blank" rel="noopener">Telegram</a>`);
  if (S.instagram) links.push(`<a href="${esc(S.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
  if (S.vk) links.push(`<a href="${esc(S.vk)}" target="_blank" rel="noopener">ВКонтакте</a>`);
  document.getElementById('contactlinks').innerHTML = links.join('') || '<p style="color:rgba(255,255,255,.6)">Контакты скоро появятся.</p>';
  const pb = document.getElementById('phonebtn');
  if (pb) pb.onclick = e => {
    e.preventDefault();
    if (navigator.clipboard) navigator.clipboard.writeText(S.phone);
    pb.textContent = 'Номер скопирован: ' + S.phone;
  };
  updateCart();
}

document.getElementById('grid').addEventListener('click', e => {
  const dl = e.target.dataset && e.target.dataset.dl;
  if (dl) {
    const a = S.apps.find(x => x.id === Number(dl));
    if (a) { a.downloads = (a.downloads || 0) + 1; save(); }
    return;
  }
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  const a = S.apps.find(x => x.id === Number(id));
  if (a && !cart.has(a.id)) { a.orders = (a.orders || 0) + 1; save(); }
  cart.add(Number(id));
  render();
});

function updateCart() {
  document.getElementById('cartbar').classList.toggle('show', cart.size > 0);
  document.getElementById('cartcount').textContent = 'В корзине: ' + cart.size;
  const names = S.apps.filter(a => cart.has(a.id)).map(a => a.name).join(', ');
  const text = encodeURIComponent('Здравствуйте! Хочу заказать: ' + names);
  document.getElementById('checkout').href = S.telegram ? `https://t.me/${S.telegram}?text=${text}` : '#';
}

document.getElementById('clear').addEventListener('click', () => { cart.clear(); render(); });

/* ---------------- Админ-панель ---------------- */
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

document.getElementById('gear').addEventListener('click', async () => {
  if (!sb) { alert('Нет связи с базой данных'); return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session) openPanel(); else openLogin();
});

function openLogin() {
  panel.innerHTML = `<h2>Вход в админку</h2>
  <label>Почта</label><input id="l_email" type="email" autocomplete="username">
  <label>Пароль</label><input id="l_pass" type="password" autocomplete="current-password">
  <div id="l_err" class="hint" style="color:#ff9b9b"></div>
  <div style="margin-top:18px"><button class="btn dl" id="l_go">Войти</button> <button class="btn gray" id="l_close">Закрыть</button></div>`;
  overlay.classList.add('show');
  document.getElementById('l_close').onclick = () => overlay.classList.remove('show');
  const go = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('l_email').value.trim(), password: document.getElementById('l_pass').value });
    if (error) { document.getElementById('l_err').textContent = 'Не удалось войти: ' + error.message; return; }
    openPanel();
  };
  document.getElementById('l_go').onclick = go;
  document.getElementById('l_pass').onkeydown = e => { if (e.key === 'Enter') go(); };
}

overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

function openPanel() {
  let html = `<h2>Админ-панель</h2>
  <h3>Сайт</h3>
  <label>Название (большое слово наверху)</label><input id="a_siteName" value="${esc(S.siteName)}">
  <label>Стиль шапки</label>
  <select id="a_headerStyle" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#2a2a34;color:#fff;font-size:15px">
    <option value="apple" ${S.headerStyle === 'apple' || !S.headerStyle ? 'selected' : ''}>Apple (стекло)</option>
    <option value="insta" ${S.headerStyle === 'insta' ? 'selected' : ''}>Instagram (градиент)</option>
    <option value="board" ${S.headerStyle === 'board' ? 'selected' : ''}>Доска (гвозди, огонь, дым)</option>
  </select>
  <label>Прозрачность шапки (0 — совсем прозрачная, 100 — плотная)</label>
  <input id="a_barOpacity" type="range" min="0" max="100" value="${S.barOpacity == null ? 55 : S.barOpacity}" style="padding:0">
  <label>Широкая картинка вместо шапки (баннер)</label>
  <div class="row" style="align-items:center">
    <img id="a_bannerPrev" src="${esc(S.banner || '')}" alt="" style="max-width:140px;max-height:70px;border-radius:10px;flex:0 0 auto;${S.banner ? '' : 'display:none'}">
    <input type="file" accept="image/*" id="a_bannerFile">
  </div>
  <button class="btn gray" id="a_bannerClear" type="button">Убрать картинку</button>
  <label>Затемнение картинки (чтобы надписи читались)</label>
  <input id="a_bannerDim" type="range" min="0" max="80" value="${S.bannerDim == null ? 35 : S.bannerDim}" style="padding:0">
  <label>Ширина баннера</label>
  <input id="a_bannerW" type="range" min="320" max="1200" step="10" value="${S.bannerW || 760}" style="padding:0">
  <label>Высота баннера (слева — по тексту, справа — выше)</label>
  <input id="a_bannerH" type="range" min="0" max="600" step="10" value="${S.bannerH || 0}" style="padding:0">
  <label>Подзаголовок</label><input id="a_tagline" value="${esc(S.tagline)}">
  <label>Описание в шапке</label><textarea id="a_about">${esc(S.about)}</textarea>

  <h3>Контакты</h3>
  <div class="row">
    <div><label>Ник в Telegram (без @)</label><input id="a_telegram" value="${esc(S.telegram)}"></div>
    <div><label>Телефон</label><input id="a_phone" value="${esc(S.phone)}" placeholder="+79990000000"></div>
  </div>
  <div class="row">
    <div><label>WhatsApp (только цифры)</label><input id="a_whatsapp" value="${esc(S.whatsapp)}" placeholder="79990000000"></div>
    <div><label>Ссылка ВКонтакте</label><input id="a_vk" value="${esc(S.vk)}" placeholder="https://vk.com/..."></div>
  </div>
  <div class="row">
    <div><label>Ссылка Instagram</label><input id="a_instagram" value="${esc(S.instagram || '')}" placeholder="https://instagram.com/..."></div>
  </div>

  <h3>Приложения</h3>
  <div class="hint">Файл APK загружай кнопкой «Выбрать файл» у приложения (до 50 МБ). Пока переключатель «Разрешить скачивание» выключен, человек видит только кнопку заказа. Внизу не забудь нажать «Сохранить».</div>
  <div id="applist"></div>
  <button class="btn" id="addapp">+ Добавить приложение</button>


  <div style="margin-top:22px">
    <button class="btn dl" id="savebtn">Сохранить</button>
    <button class="btn gray" id="closebtn">Закрыть</button>
    <button class="btn gray" id="logoutbtn">Выйти из аккаунта</button>
  </div>`;
  panel.innerHTML = html;
  drawApps();
  overlay.classList.add('show');
  document.getElementById('a_bannerW').oninput = e => document.documentElement.style.setProperty('--ban-w', e.target.value + 'px');
  document.getElementById('a_bannerH').oninput = e => document.documentElement.style.setProperty('--ban-h', e.target.value + 'px');
  document.getElementById('a_bannerDim').oninput = e => document.documentElement.style.setProperty('--ban-dim', e.target.value / 100);
  document.getElementById('a_bannerClear').onclick = () => {
    S.banner = '';
    const pv = document.getElementById('a_bannerPrev'); pv.src = ''; pv.style.display = 'none';
    document.getElementById('a_bannerFile').value = '';
  };
  document.getElementById('a_bannerFile').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      S.banner = await uploadImg(file, 1600, 0.82);
      const pv = document.getElementById('a_bannerPrev'); pv.src = S.banner; pv.style.display = '';
    } catch (err) { alert('Не удалось загрузить картинку: ' + (err.message || err)); }
  };
  document.getElementById('a_barOpacity').oninput = e => document.documentElement.style.setProperty('--bar-op', e.target.value / 100);

  document.getElementById('addapp').onclick = () => {
    readApps();
    S.apps.push({ id: -Date.now(), name: "Новое приложение", desc: "", image: "", price: "", open: false, file: "", badge: "" });
    drawApps();
  };
  document.getElementById('closebtn').onclick = () => overlay.classList.remove('show');
  document.getElementById('logoutbtn').onclick = async () => { await sb.auth.signOut(); overlay.classList.remove('show'); };
  document.getElementById('savebtn').onclick = async () => {
    const btn = document.getElementById('savebtn');
    S.siteName = document.getElementById('a_siteName').value.trim() || "Dock";
    S.tagline = document.getElementById('a_tagline').value;
    S.headerStyle = document.getElementById('a_headerStyle').value;
    S.barOpacity = Number(document.getElementById('a_barOpacity').value);
    S.bannerDim = Number(document.getElementById('a_bannerDim').value);
    S.bannerW = Number(document.getElementById('a_bannerW').value);
    S.bannerH = Number(document.getElementById('a_bannerH').value);
    S.about = document.getElementById('a_about').value;
    S.telegram = document.getElementById('a_telegram').value.replace('@', '').trim();
    S.phone = document.getElementById('a_phone').value.trim();
    S.whatsapp = document.getElementById('a_whatsapp').value.replace(/\\D/g, '');
    S.vk = document.getElementById('a_vk').value.trim();
    S.instagram = document.getElementById('a_instagram').value.trim();
    readApps();
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    try { await saveAll(); render(); overlay.classList.remove('show'); }
    catch (err) { alert('Не удалось сохранить: ' + (err.message || err)); }
    btn.disabled = false; btn.textContent = 'Сохранить';
  };
}

function drawApps() {
  const box = document.getElementById('applist');
  box.innerHTML = S.apps.map((a, i) => `
    <div class="appbox" data-i="${i}">
      <div class="row">
        <div><label>Название</label><input data-f="name" value="${esc(a.name)}"></div>
        <div><label>Цена</label><input data-f="price" value="${esc(a.price)}"></div>
      </div>
      <label>Значок над карточкой</label>
      <select data-f="badge" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#2a2a34;color:#fff;font-size:15px">
        <option value="" ${!a.badge ? 'selected' : ''}>Без значка</option>
        <option value="top" ${a.badge === 'top' ? 'selected' : ''}>Топ</option>
        <option value="new" ${a.badge === 'new' ? 'selected' : ''}>Новинка</option>
        <option value="sale" ${a.badge === 'sale' ? 'selected' : ''}>Акция</option>
      </select>
      <label>Описание</label><textarea data-f="desc">${esc(a.desc)}</textarea>
      <label>Картинка (необязательно)</label>
      <div class="row" style="align-items:center">
        <img src="${esc(a.image)}" alt="" style="max-width:70px;max-height:70px;border-radius:10px;flex:0 0 auto;${a.image ? '' : 'display:none'}">
        <input type="file" accept="image/*" data-pick="${i}">
      </div>
      <input type="hidden" data-f="image" value="${esc(a.image)}">
      <label>Файл APK</label>
      <input type="file" data-apk="${i}"><div class="hint" style="font-size:13px">${a.file ? 'Загружен: ' + esc(a.file.split('/').pop()) : 'Файл не выбран'}</div>
      <input data-f="file" value="${esc(a.file)}" placeholder="или вставь ссылку вручную">
      <div class="switch"><input type="checkbox" data-f="open" ${a.open ? 'checked' : ''}> Разрешить скачивание</div>
      <button class="btn gray" data-del="${i}">Удалить</button>
    </div>`).join('');
  box.querySelectorAll('[data-pick]').forEach(inp => inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    try {
      const url = await uploadImg(file, 600, 0.8);
      readApps();
      S.apps[Number(inp.dataset.pick)].image = url;
      drawApps();
    } catch (err) { alert('Не удалось загрузить картинку: ' + (err.message || err)); }
  });
  box.querySelectorAll('[data-apk]').forEach(inp => inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { alert('Файл больше 50 МБ, на бесплатном тарифе он не загрузится.'); inp.value = ''; return; }
    const hint = inp.nextElementSibling; hint.textContent = 'Загружаю…';
    try {
      const url = await uploadBlob('files/' + Date.now() + '-' + file.name.replace(/[^\\w.\\-]+/g, '_'), file);
      readApps();
      S.apps[Number(inp.dataset.apk)].file = url;
      drawApps();
    } catch (err) { hint.textContent = 'Ошибка: ' + (err.message || err); }
  });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    readApps();
    const rm = S.apps.splice(Number(b.dataset.del), 1)[0];
    if (rm && rm.id > 0) deletedIds.push(rm.id);
    drawApps();
  });
}

function readApps() {
  document.querySelectorAll('#applist .appbox').forEach(box => {
    const a = S.apps[Number(box.dataset.i)];
    if (!a) return;
    box.querySelectorAll('[data-f]').forEach(el => {
      const f = el.dataset.f;
      a[f] = f === 'open' ? el.checked : el.value;
    });
  });
}

render();
load();
</script>
</body>
</html>
